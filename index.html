<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      const errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '0';
      errorDiv.style.left = '0';
      errorDiv.style.width = '100%';
      errorDiv.style.backgroundColor = '#fee2e2';
      errorDiv.style.color = '#991b1b';
      errorDiv.style.padding = '20px';
      errorDiv.style.zIndex = '9999';
      errorDiv.style.fontFamily = 'monospace';
      errorDiv.style.borderBottom = '2px solid #7f1d1d';
      errorDiv.innerHTML = `<strong>Error:</strong> ${message}<br>
          <small>${source}:${lineno}:${colno}</small><br>
          <pre>${error ? error.stack : ''}</pre>`;
      document.body.appendChild(errorDiv);
    };
    window.onunhandledrejection = function (event) {
      const errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '0';
      errorDiv.style.left = '0';
      errorDiv.style.width = '100%';
      errorDiv.style.backgroundColor = '#fee2e2';
      errorDiv.style.color = '#991b1b';
      errorDiv.style.padding = '20px';
      errorDiv.style.zIndex = '9999';
      errorDiv.style.fontFamily = 'monospace';
      errorDiv.style.borderBottom = '2px solid #7f1d1d';
      errorDiv.innerHTML = `<strong>Unhandled Rejection:</strong> ${event.reason}`;
      document.body.appendChild(errorDiv);
    };
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STA | AI for Educators</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Driven by the CSS variables in :root below, so the palette can be
            // swapped at runtime. Channel-only vars + <alpha-value> keep opacity
            // modifiers working (bg-sta-primary/10, bg-black/50).
            black: 'rgb(var(--sta-frame) / <alpha-value>)', // border-black / shadow-hard framing
            sta: {
              primary: 'rgb(var(--sta-primary) / <alpha-value>)', // Indigo 600 - Vibrant Blue
              secondary: 'rgb(var(--sta-secondary) / <alpha-value>)', // Pink 600 - Pop Pink
              accent: 'rgb(var(--sta-accent) / <alpha-value>)', // Amber 400 - Gen Z Yellow
              coral: 'rgb(var(--sta-coral) / <alpha-value>)', // Soft Red
              mint: 'rgb(var(--sta-mint) / <alpha-value>)', // Mint Green
              dark: 'rgb(var(--sta-dark) / <alpha-value>)', // Slate 800 - text
              cta: 'rgb(var(--sta-cta) / <alpha-value>)', // Button fill
              'cta-hover': 'rgb(var(--sta-cta-hover) / <alpha-value>)', // Button hover fill
              surface: 'rgb(var(--sta-surface) / <alpha-value>)', // Slate 100
              paper: 'rgb(var(--sta-paper) / <alpha-value>)',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'], // Added for "technical" feel
          },
          boxShadow: {
            'hard': '4px 4px 0px 0px rgb(var(--sta-frame))',
            'hard-sm': '2px 2px 0px 0px rgb(var(--sta-frame))',
            'hard-lg': '8px 8px 0px 0px rgb(var(--sta-frame))',
            'hard-white': '4px 4px 0px 0px #ffffff',
          }
        }
      }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    /* Palette, as space-separated RGB channels so Tailwind's <alpha-value>
       substitution works (bg-sta-primary/10, bg-black/50 depend on it).
       Change a value here and every sta-* utility follows. */
    :root {
      --sta-primary: 79 70 229;
      /* #4f46e5 */
      --sta-secondary: 219 39 119;
      /* #db2777 */
      --sta-accent: 251 191 36;
      /* #fbbf24 */
      --sta-coral: 248 113 113;
      /* #f87171 */
      --sta-mint: 52 211 153;
      /* #34d399 */
      --sta-dark: 30 41 59;
      /* #1e293b - text, stays neutral */
      --sta-surface: 241 245 249;
      /* #f1f5f9 */
      --sta-paper: 255 255 255;
      /* #ffffff */

      --sta-cta: 79 70 229;
      /* #4f46e5 - button fill (indigo, matches sta-primary) */
      --sta-cta-hover: 67 56 202;
      /* #4338ca - button hover fill */
      --sta-frame: 0 0 0;
      /* #000000 - borders + hard shadows */
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    /* Dot pattern for background texture */
    .bg-dot-pattern {
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    /* Paper texture effect */
    .bg-paper-texture {
      background-color: #ffffff;
      background-image: linear-gradient(#f1f5f9 1px, transparent 1px), linear-gradient(90deg, #f1f5f9 1px, transparent 1px);
      background-size: 40px 40px;
    }
  </style>
</head>

<body class="bg-white text-slate-900 antialiased selection:bg-sta-accent selection:text-sta-dark">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
